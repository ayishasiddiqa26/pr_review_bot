name: PR Review Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate PR summary
        env:
          FILES_CHANGED: ${{ github.event.pull_request.changed_files }}
          ADDED: ${{ github.event.pull_request.additions }}
          REMOVED: ${{ github.event.pull_request.deletions }}
        run: |
          echo "Files: $FILES_CHANGED"
          echo "Added: $ADDED"
          echo "Removed: $REMOVED"

          TODOS=""

          for file in $(git diff --name-only origin/main...HEAD)
          do
            if [ -f "$file" ]; then
              MATCHES=$(grep -nE "TODO|FIXME" "$file" || true)

              if [ ! -z "$MATCHES" ]; then
                TODOS="$TODOS\n$file\n$MATCHES\n"
              fi
            fi
          done

          git fetch origin main
          git diff --stat origin/main...HEAD > diffstat.txt

          cat > comment.md <<EOF
          ## Automated PR Review

          **Files Changed:** $FILES_CHANGED

          **Lines Added:** $ADDED

          **Lines Removed:** $REMOVED

          ### TODO / FIXME

          $TODOS

          ### Diff Statistics

          $(cat diffstat.txt)
          EOF

      - name: Create comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -d "{\"body\":$(cat comment.md | jq -Rs .)}"
